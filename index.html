<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xbowery</title>
<meta name="description" content="Xbowery. Студент, 2 курс.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="Xbowery">
<meta property="og:description" content="Студент, 2 курс.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://maks3592.github.io/xbowery/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;
  --card:rgba(14,14,14,.66);
  --line:rgba(255,255,255,.12);
  --line-strong:rgba(255,255,255,.3);
  --text:#ececec;
  --dim:#8d8d8d;
  --accent:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
img,video{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"JetBrains Mono",ui-monospace,monospace;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.collage{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;
  background:#070707;
}
.tile{
  position:absolute;overflow:hidden;
  width:62vw;height:64vh;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 72%);
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 72%);
}
.tile>*{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  background-size:cover;background-position:center;
  filter:grayscale(1) brightness(.8) contrast(1.1);
  transform:scale(1.08);
  animation:drift 26s ease-in-out infinite alternate;
}
.tile:nth-child(1){left:-12vw;top:-14vh}
.tile:nth-child(2){left:20vw;top:-18vh}
.tile:nth-child(3){right:-14vw;top:-12vh}
.tile:nth-child(4){left:-14vw;bottom:-16vh}
.tile:nth-child(5){left:22vw;bottom:-20vh}
.tile:nth-child(6){right:-12vw;bottom:-14vh}
.tile:nth-child(2)>*{animation-duration:32s;animation-direction:alternate-reverse}
.tile:nth-child(3)>*{animation-duration:29s}
.tile:nth-child(4)>*{animation-duration:35s;animation-direction:alternate-reverse}
.tile:nth-child(5)>*{animation-duration:30s}
.tile:nth-child(6)>*{animation-duration:27s;animation-direction:alternate-reverse}
@keyframes drift{
  from{transform:scale(1.08) translate(-2%,-1%)}
  to{transform:scale(1.22) translate(2%,1.5%)}
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:1}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
.grain{
  position:fixed;inset:-10%;z-index:2;pointer-events:none;opacity:.09;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}
  20%{transform:translate(-3%,2%)}
  40%{transform:translate(2%,-3%)}
  60%{transform:translate(-2%,-1%)}
  80%{transform:translate(3%,3%)}
  100%{transform:translate(0,0)}
}
.vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.8) 100%);
}
main{
  position:relative;z-index:4;
  width:100%;max-width:460px;
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.card{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  backdrop-filter:blur(16px) saturate(110%);
  -webkit-backdrop-filter:blur(16px) saturate(110%);
  padding:34px 32px 24px;
  box-shadow:0 40px 100px rgba(0,0,0,.7);
}
.card::before,.card::after,.corner-a,.corner-b{
  content:"";position:absolute;width:18px;height:18px;border:1px solid var(--accent);pointer-events:none;
}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{top:-1px;right:-1px;border-left:0;border-bottom:0}
.corner-a{bottom:-1px;left:-1px;border-right:0;border-top:0}
.corner-b{bottom:-1px;right:-1px;border-left:0;border-top:0}
.head{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.avatar{
  width:92px;height:92px;flex:none;position:relative;
  border:1px solid var(--line-strong);
  background:#141414;
  display:flex;align-items:center;justify-content:center;
  font-family:"Pirata One",serif;font-size:48px;color:var(--text);
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) brightness(.95);transition:filter .5s}
.avatar:hover img{filter:saturate(1.05) brightness(1)}
.nick{
  font-family:"Pirata One",serif;
  font-size:54px;line-height:1;letter-spacing:.5px;
  color:var(--accent);
}
.tag{display:block;margin-top:10px;font-size:11px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase}
.rows{border-top:1px solid var(--line);margin-bottom:26px}
.row{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:12px 0;border-bottom:1px solid var(--line);
  font-size:15px;
  opacity:0;transform:translateX(-8px);
  animation:in .6s ease forwards;
}
.row:nth-child(1){animation-delay:.35s}
.row:nth-child(2){animation-delay:.5s}
.row:nth-child(3){animation-delay:.65s}
.row:nth-child(4){animation-delay:.8s}
.row:nth-child(5){animation-delay:.95s}
.row:nth-child(6){animation-delay:1.1s}
@keyframes in{to{opacity:1;transform:none}}
.k{color:var(--dim)}
.k::after{content:":"}
.v{color:var(--text);text-align:right}
.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lw{position:relative}
.lw[hidden]{display:none}
.links.single{grid-template-columns:1fr}
.link{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 10px;
  border:1px solid var(--line);
  color:var(--text);text-decoration:none;font-size:14px;letter-spacing:.04em;
  background:rgba(255,255,255,.03);
  transition:background .25s,border-color .25s,color .25s,transform .25s;
}
.link svg{width:20px;height:20px;fill:currentColor;flex:none}
.link:hover,.link:focus-visible{background:var(--accent);color:#0a0a0a;border-color:var(--accent);transform:translateY(-2px);outline:none}
.pv{
  position:absolute;left:50%;bottom:calc(100% + 14px);
  width:272px;
  transform:translate(-50%,8px) scale(.96);
  opacity:0;pointer-events:none;
  background:#0f0f0f;
  border:1px solid var(--line-strong);
  box-shadow:0 24px 60px rgba(0,0,0,.8);
  transition:opacity .25s,transform .25s;
  z-index:10;
}
.pv::after{
  content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;
  background:#0f0f0f;border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);
  transform:translate(-50%,-5px) rotate(45deg);
}
.lw:hover .pv,.lw:focus-within .pv{opacity:1;transform:translate(-50%,0) scale(1)}
.pv-cover{height:84px;background-size:cover;background-position:center;filter:grayscale(1) brightness(.7)}
.pv-body{display:flex;gap:12px;padding:0 14px 14px;margin-top:-28px;position:relative}
.pv-av{
  width:56px;height:56px;flex:none;border:2px solid #0f0f0f;outline:1px solid var(--line-strong);
  background:#1a1a1a;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-family:"Pirata One",serif;font-size:30px;
}
.pv-av img{width:100%;height:100%;object-fit:cover}
.pv-txt{padding-top:32px;min-width:0}
.pv-name{font-size:14px;color:var(--text)}
.pv-sub{font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-go{
  position:absolute;right:12px;top:-46px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.8);text-shadow:0 1px 6px rgba(0,0,0,.9)
}
.foot{
  margin-top:22px;text-align:center;font-size:10px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase;
  border-top:1px solid var(--line);padding-top:16px
}
.fl{
  position:fixed;z-index:3;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
  will-change:transform;
}
.fl>*{animation:float var(--dur,9s) ease-in-out var(--delay,0s) infinite}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(var(--r,0deg))}
  50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 1.4deg))}
}
.fl.win{z-index:5;top:4vh;right:3vw;width:360px}
.win-box{
  position:relative;
  background:var(--card);
  border:1px solid var(--line-strong);
  backdrop-filter:blur(16px) saturate(110%);
  -webkit-backdrop-filter:blur(16px) saturate(110%);
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.win-bar{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
}
.win-bar i{width:7px;height:7px;border:1px solid var(--line-strong);display:block}
.win-bar b{font-weight:400;margin-left:auto}
.player{
  padding:14px;
  display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;
}
.cover{
  width:72px;height:72px;border:1px solid var(--line-strong);background:#141414;
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
}
.cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) brightness(.93)}
.cover .bars{display:none;position:absolute;inset:auto 0 5px 0;justify-content:center;gap:3px;height:16px;align-items:flex-end}
.cover.playing .bars{display:flex}
.bars i{width:3px;background:var(--accent);height:30%;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}
.bars i:nth-child(3){animation-delay:.4s}
.bars i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.meta{min-width:0}
.title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;align-items:center;gap:6px;margin-top:10px}
.btn{
  width:30px;height:30px;border:1px solid var(--line);background:transparent;color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  transition:background .2s,color .2s;
}
.btn:hover{background:var(--accent);color:#0a0a0a}
.btn svg{width:14px;height:14px;fill:currentColor}
.bar{flex:1;height:30px;display:flex;align-items:center;cursor:pointer;min-width:0;padding:0 4px}
.track{width:100%;height:3px;background:var(--line);position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.time{font-size:10px;color:var(--dim);flex:none;min-width:28px;text-align:right}
.volrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.vbtn{width:26px;height:26px}
.vnum{font-size:10px;color:var(--dim);min-width:22px;text-align:right}
#vol{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:26px;background:transparent;cursor:pointer;margin:0
}
#vol::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--accent) var(--p,10%),var(--line) var(--p,10%))}
#vol::-moz-range-track{height:3px;background:var(--line)}
#vol::-moz-range-progress{height:3px;background:var(--accent)}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-3.5px;background:var(--accent);border:0;border-radius:0}
#vol::-moz-range-thumb{width:10px;height:10px;background:var(--accent);border:0;border-radius:0}
#vol:focus-visible{outline:1px solid var(--line-strong);outline-offset:2px}
.enter{
  position:fixed;inset:0;z-index:25;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(6,6,6,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:0;color:var(--text);cursor:pointer;font-family:inherit;
  transition:opacity .56s cubic-bezier(.2,.8,.2,1),visibility .56s;
}
.enter.out{opacity:0;visibility:hidden;pointer-events:none}
.enter-nick{font-family:"Pirata One",serif;font-size:clamp(56px,10vw,96px);line-height:1;color:var(--accent)}
.enter-cta{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.enter-cta i{display:inline-block;width:7px;height:12px;background:var(--dim);margin-left:8px;vertical-align:-1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.enter-ru{font-size:11px;color:var(--dim);opacity:.7;margin-top:-8px;letter-spacing:.04em}
html.locked,html.locked body{overflow:hidden}
html.gate .enter{display:flex}
html.locked main,html.locked .row{animation-play-state:paused}
.ph{
  position:relative;
  padding:6px;
  background:rgba(14,14,14,.72);
  border:1px solid var(--line-strong);
  box-shadow:0 24px 60px rgba(0,0,0,.65);
}
.ph-in{position:relative;overflow:hidden;aspect-ratio:var(--ar,4/3);background:#111}
.ph-in img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:saturate(.72) brightness(.93) contrast(1.04);
  transition:filter .5s;
  animation-fill-mode:both;
}
.ph:hover .ph-in img{filter:saturate(1.05) brightness(1)}
.fl:hover{z-index:6}
.fx-fade{animation:fx-fade 1.4s cubic-bezier(.2,.8,.2,1)}
.fx-soft{animation:fx-soft 1.6s cubic-bezier(.2,.8,.2,1)}
.fx-rise{animation:fx-rise 1.3s cubic-bezier(.2,.8,.2,1)}
@keyframes fx-fade{from{opacity:0}to{opacity:1}}
@keyframes fx-soft{from{opacity:0;filter:blur(10px) saturate(.4) brightness(.8);transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
@keyframes fx-rise{from{clip-path:inset(100% 0 0 0);transform:scale(1.03)}to{clip-path:inset(0 0 0 0);transform:scale(1)}}
.L1{left:-2vw;top:3vh;width:14vw;--ar:4/3;--r:-4deg;--dur:10s}
.L2{left:14vw;top:2vh;width:11vw;--ar:3/4;--r:3deg;--dur:8s;--delay:-3s}
.L3{left:24vw;top:15vh;width:10vw;--ar:1/1;--r:-2deg;--dur:11s;--delay:-6s}
.L4{left:2vw;top:29vh;width:12vw;--ar:3/4;--r:2deg;--dur:9s;--delay:-2s}
.L5{left:15vw;top:36vh;width:13vw;--ar:4/3;--r:-3deg;--dur:12s;--delay:-7s}
.L6{left:-1vw;top:62vh;width:13vw;--ar:4/3;--r:3deg;--dur:10s;--delay:-4s}
.L7{left:13vw;top:61vh;width:10vw;--ar:3/4;--r:-2deg;--dur:8s;--delay:-1s}
.L8{left:24vw;top:57vh;width:9vw;--ar:4/5;--r:4deg;--dur:11s;--delay:-5s}
.L9{left:3vw;top:84vh;width:10vw;--ar:4/3;--r:-3deg;--dur:9s;--delay:-8s}
.R2{right:16vw;top:25vh;width:11vw;--ar:3/4;--r:-3deg;--dur:9s;--delay:-4s}
.R3{right:2vw;top:24vh;width:12vw;--ar:4/5;--r:3deg;--dur:10s;--delay:-1s}
.R4{right:26vw;top:44vh;width:8vw;--ar:1/1;--r:3deg;--dur:12s;--delay:-6s}
.R5{right:-2vw;top:55vh;width:12vw;--ar:3/4;--r:-2deg;--dur:11s;--delay:-3s}
.R6{right:12vw;top:57vh;width:12vw;--ar:4/3;--r:2deg;--dur:8s;--delay:-7s}
.R7{right:25vw;top:73vh;width:9vw;--ar:4/3;--r:-4deg;--dur:10s;--delay:-2s}
.R8{right:11vw;top:81vh;width:11vw;--ar:4/3;--r:3deg;--dur:9s;--delay:-5s}
.fl.win>*{--dur:7s}
.scatter{display:contents}
@media (max-width:1250px){
  .L3,.L8,.R4,.R7{display:none}
}
@media (max-height:640px) and (min-width:901px){
  .L9,.R8{display:none}
}
@media (max-width:900px){
  body{flex-direction:column;justify-content:flex-start;gap:20px;padding:156px 16px 32px}
  .fl{position:static;width:100%;transition:none}
  .fl>*{animation-duration:9s}
  .fl.win{position:fixed;top:10px;right:10px;left:auto;width:min(300px,calc(100vw - 20px));z-index:20;order:0}
  .win-bar{cursor:pointer}
  .win-box{background:rgba(10,10,10,.92)}
  .win-bar b::after{content:" \2212"}
  .win-box.min .win-bar b::after{content:" +"}
  .win-box.min .player{display:none}
  .player{padding:10px;grid-template-columns:56px 1fr;gap:12px}
  .cover{width:56px;height:56px}
  .ctrl{margin-top:6px;gap:5px}
  .btn{width:28px;height:28px}
  .bar{height:28px}
  .volrow{margin-top:4px}
  main{order:1}
  .scatter{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;order:2;max-width:460px;width:100%}
  .scatter .fl{width:100%;display:block}
  .scatter .ph{padding:4px}
  .scatter .fl:nth-child(n+10){display:none}
  .ph-in{aspect-ratio:3/4}
  .pv{display:none}
  .card{padding:26px 20px 20px}
  .nick{font-size:46px}
  .avatar{width:80px;height:80px}
}
@media (max-width:400px){
  .links{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div class="collage" aria-hidden="true">
  <div class="tile"><div style="background-image:url(assets/bg/1.jpg)"></div></div>
  <div class="tile"><div style="background-image:url(assets/bg/5.jpg)"></div></div>
  <div class="tile"><video src="assets/bg/6.mp4" autoplay muted loop playsinline disablepictureinpicture preload="auto"></video></div>
  <div class="tile"><div style="background-image:url(assets/bg/2.jpg)"></div></div>
  <div class="tile"><div style="background-image:url(assets/bg/4.jpg)"></div></div>
  <div class="tile"><div style="background-image:url(assets/bg/3.jpg)"></div></div>
</div>
<canvas id="bg"></canvas>
<canvas id="snow"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<div class="fl win"><div class="win-box">
  <div class="win-bar"><i></i><i></i><i></i><b>now playing</b></div>
  <div class="player" id="player">
        <div class="cover" id="cover">
          <img id="coverImg" alt="" src="" onerror="this.style.display='none'">
          <span class="bars"><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="meta">
          <div class="title" id="title">&nbsp;</div>
          <div class="artist" id="artist">&nbsp;</div>
          <div class="ctrl">
            <button class="btn" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
            <button class="btn" id="play" aria-label="Играть"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
            <button class="btn" id="next" aria-label="Дальше"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
            <div class="bar" id="bar"><div class="track"><div class="fill" id="fill"></div></div></div>
            <span class="time" id="time">0:00</span>

<script>
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
const BIRTH_YEAR = 2008;
const BIRTH_MONTH = 11;
const BIRTH_DAY = 6;
const BIRTH_HOUR_MSK = 7;
const ENTER_SCREEN = true;
const SHOW_TG = false;
const TG_USER = "";
const STEAM_ID = "Xbowery";


(function(){
  const ageEl = document.getElementById("age");
  const calcAge = () => {
    const msk = new Date(Date.now() + 3 * 3600 * 1000);
    const y = msk.getUTCFullYear(), mo = msk.getUTCMonth(), d = msk.getUTCDate(), h = msk.getUTCHours();
    let age = y - BIRTH_YEAR;
    if (mo < BIRTH_MONTH || (mo === BIRTH_MONTH && (d < BIRTH_DAY || (d === BIRTH_DAY && h < BIRTH_HOUR_MSK)))) age -= 1;
    ageEl.textContent = age;
  };
  calcAge();
  setInterval(calcAge, 60000);
  const tgOn = !!(SHOW_TG && TG_USER);
  document.getElementById("tgWrap").hidden = !tgOn;
  document.getElementById("links").classList.toggle("single", !tgOn);
  if (TG_USER){
    document.getElementById("tg").href = "https://t.me/" + TG_USER;
    document.getElementById("tgSub").textContent = "@" + TG_USER;
  }
  document.getElementById("st").href = "https://steamcommunity.com/id/" + STEAM_ID;
  document.getElementById("stSub").textContent = "steamcommunity.com/id/" + STEAM_ID;
})();

(function(){
  const c = document.getElementById("bg");
  const ctx = c.getContext("2d");
  let w, h, dpr, pts = [];
  const mouse = { x: -9999, y: -9999 };

  let lastW = 0;
  const still = matchMedia("(prefers-reduced-motion:reduce)").matches;

  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const nh = innerHeight * dpr;
    if (pts.length && innerWidth === lastW){
      for (const p of pts) p.y = p.y * nh / h;
      h = c.height = nh;
      if (still) frame();
      return;
    }
    lastW = innerWidth;
    w = c.width = innerWidth * dpr;
    h = c.height = nh;
    const n = Math.round((innerWidth * innerHeight) / 15000);
    pts = Array.from({ length: Math.min(n, 110) }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - .5) * .25 * dpr,
      vy: (Math.random() - .5) * .25 * dpr,
      r: (Math.random() * 1.4 + .4) * dpr
    }));
  }

  function frame(){
    ctx.clearRect(0, 0, w, h);
    const link = 130 * dpr;
    for (const p of pts){
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d = Math.hypot(dx, dy);
      if (d < 140 * dpr && d > 0){
        p.x += dx / d * .6 * dpr;
        p.y += dy / d * .6 * dpr;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.fill();
    }
    for (let i = 0; i < pts.length; i++){
      for (let j = i + 1; j < pts.length; j++){
        const a = pts[i], b = pts[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < link){
          ctx.strokeStyle = "rgba(255,255,255," + (.18 * (1 - d / link)) + ")";
          ctx.lineWidth = dpr * .6;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    if (!still) requestAnimationFrame(frame);
  }

  addEventListener("resize", () => { size(); if (still) frame(); });
  addEventListener("pointermove", e => { mouse.x = e.clientX * dpr; mouse.y = e.clientY * dpr; });
  addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
  size();
  frame();
})();


(function(){
  const el = document.getElementById("enter");
  if (!ENTER_SCREEN){ el.remove(); return; }
  const root = document.documentElement;
  const behind = Array.from(document.querySelectorAll("main,.fl.win,.scatter"));
  root.classList.add("gate", "locked");
  behind.forEach(n => n.inert = true);
  el.focus({ preventScroll: true });
  if (matchMedia("(pointer:coarse)").matches) { document.getElementById("enterText").textContent = "tap to enter"; document.getElementById("enterRu").textContent = "коснись экрана, чтобы войти"; }
  const go = () => {
    el.classList.add("out");
    root.classList.remove("locked");
    behind.forEach(n => n.inert = false);
    setTimeout(() => el.remove(), 700);
  };
  el.addEventListener("click", go);
  addEventListener("keydown", function k(e){
    if (!document.body.contains(el)) return removeEventListener("keydown", k);
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); }
  });
})();

(function(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const c = document.getElementById("snow");
  const ctx = c.getContext("2d");
  const card = document.querySelector(".card");
  let w, h, dpr, flakes = [], extra = [], settled = [];
  let t = 0;
  const m = { x: -1e4, y: -1e4, vx: 0, vy: 0, last: 0 };

  function make(initial){
    const big = Math.random() < .22;
    const px = big ? 4 : Math.random() < .5 ? 3 : 2;
    return {
      x: Math.random() * (w + 40 * dpr) - 20 * dpr,
      y: initial ? Math.random() * h : -10 * dpr,
      s: px * dpr,
      v: (big ? .9 : .45 + Math.random() * .45) * dpr,
      a: big ? .75 : .35 + Math.random() * .35,
      p: Math.random() * Math.PI * 2,
      sw: (.2 + Math.random() * .5) * dpr,
      vx: 0, vy: 0
    };
  }

  let lastW = 0;

  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const nh = innerHeight * dpr;
    if (flakes.length && innerWidth === lastW){
      for (const f of flakes) f.y = f.y * nh / h;
      h = c.height = nh;
      return;
    }
    lastW = innerWidth;
    w = c.width = innerWidth * dpr;
    h = c.height = nh;
    const n = Math.min(Math.round(innerWidth * innerHeight / 14000), 120);
    flakes = Array.from({ length: n }, () => make(true));
    settled = [];
  }

  function burst(x, y){
    for (let i = 0; i < 26; i++){
      const f = make(false);
      const ang = Math.random() * Math.PI * 2;
      const sp = (1.5 + Math.random() * 3.5) * dpr;
      f.x = x; f.y = y;
      f.vx = Math.cos(ang) * sp;
      f.vy = Math.sin(ang) * sp - 1.5 * dpr;
      f.life = 1;
      extra.push(f);
    }
    if (extra.length > 300) extra.splice(0, extra.length - 300);
  }

  function push(f){
    const dx = f.x - m.x, dy = f.y - m.y;
    const d2 = dx * dx + dy * dy;
    const R = 110 * dpr;
    if (d2 < R * R){
      const d = Math.sqrt(d2) || 1;
      const k = 1 - d / R;
      f.vx += dx / d * k * .9 * dpr + m.vx * k * .08;
      f.vy += dy / d * k * .6 * dpr + m.vy * k * .08;
    }
  }

  function step(f, wind, r){
    push(f);
    f.vx *= .94; f.vy *= .94;
    f.y += f.v + f.vy;
    f.x += wind + Math.sin(t * 2 + f.p) * f.sw * .3 + f.vx;
    if (r && Math.abs(f.vx) < .5 * dpr && f.vy > -0.2 && f.y >= r.top && f.y - f.v - f.vy < r.top && f.x > r.left && f.x < r.right && Math.random() < .7){
      settled.push({ x: f.x, y: r.top - f.s, s: f.s, a: f.a, ox: f.x - r.left, life: 1, melt: .0008 + Math.random() * .001 });
      if (settled.length > 220) settled.shift();
      return true;
    }
    return false;
  }

  function draw(x, y, s, a){
    ctx.fillStyle = "rgba(255,255,255," + a + ")";
    ctx.fillRect(Math.round(x / dpr) * dpr, Math.round(y / dpr) * dpr, s, s);
  }

  function frame(){
    t += .01;
    ctx.clearRect(0, 0, w, h);
    const wind = Math.sin(t * .6) * .25 * dpr + .12 * dpr;
    let r = null;
    if (document.getElementById("enter")) settled.length = 0;
    else if (card){
      const b = card.getBoundingClientRect();
      r = { top: b.top * dpr, left: b.left * dpr, right: b.right * dpr };
    }
    m.vx *= .85; m.vy *= .85;

    for (let i = 0; i < flakes.length; i++){
      const f = flakes[i];
      const landed = step(f, wind, r);
      if (landed || f.y > h + 10 || f.x > w + 30 || f.x < -30 || f.y < -60 * dpr){
        flakes[i] = make(false);
        continue;
      }
      draw(f.x, f.y, f.s, f.a);
    }

    for (let i = extra.length - 1; i >= 0; i--){
      const f = extra[i];
      f.life -= .006;
      const landed = step(f, wind, r);
      if (landed || f.life <= 0 || f.y > h + 10){
        extra.splice(i, 1);
        continue;
      }
      draw(f.x, f.y, f.s, f.a * Math.min(1, f.life * 2));
    }

    for (let i = settled.length - 1; i >= 0; i--){
      const p = settled[i];
      p.life -= p.melt;
      if (r){ p.x = r.left + p.ox; p.y = r.top - p.s; }
      const dx = p.x - m.x, dy = p.y - m.y;
      if (dx * dx + dy * dy < 1600 * dpr * dpr || p.life <= 0){
        if (p.life > 0){
          const f = make(false);
          f.x = p.x; f.y = p.y; f.s = p.s; f.a = p.a;
          f.vx = (dx > 0 ? 1 : -1) * (1 + Math.random() * 2) * dpr;
          f.vy = -(1 + Math.random() * 2) * dpr;
          f.life = 1;
          extra.push(f);
        }
        settled.splice(i, 1);
        continue;
      }
      draw(p.x, p.y, p.s, p.a * Math.min(1, p.life * 1.5));
    }

    requestAnimationFrame(frame);
  }

  function move(x, y){
    const nx = x * dpr, ny = y * dpr;
    const now = performance.now();
    if (m.x > -1e3 && now - m.last < 80){
      m.vx = nx - m.x;
      m.vy = ny - m.y;
    }
    m.x = nx; m.y = ny; m.last = now;
  }

  addEventListener("resize", size);
  addEventListener("pointermove", e => move(e.clientX, e.clientY), { passive: true });
  addEventListener("pointerdown", e => {
    move(e.clientX, e.clientY);
    if (e.target.closest("a,button,.bar")) return;
    burst(e.clientX * dpr, e.clientY * dpr);
  }, { passive: true });
  addEventListener("pointerup", e => { if (e.pointerType !== "mouse"){ m.x = m.y = -1e4; } });
  document.addEventListener("pointerleave", () => { m.x = m.y = -1e4; });
  size();
  frame();
})();

(function(){
  const POOL = [
    "assets/photos/01.jpg",
    "assets/photos/02.jpg",
    "assets/photos/03.jpg",
    "assets/photos/04.jpg",
    "assets/photos/05.jpg",
    "assets/photos/06.jpg",
    "assets/photos/07.jpg",
    "assets/photos/08.jpg",
    "assets/photos/09.jpg",
    "assets/photos/10.jpg",
    "assets/photos/11.jpg",
    "assets/photos/12.jpg",
    "assets/photos/13.jpg",
    "assets/photos/14.jpg",
    "assets/photos/15.jpg",
    "assets/photos/16.jpg",
    "assets/photos/17.jpg",
    "assets/photos/18.jpg",
    "assets/photos/19.jpg"
  ];
  const slots = Array.from(document.querySelectorAll(".scatter .ph-in"));
  const FX = ["soft", "soft", "rise"];
  const showing = new Set();
  let order = POOL.map((_, i) => i).sort(() => Math.random() - .5);
  let cursor = 0;

  function nextIndex(){
    for (let tries = 0; tries < POOL.length * 2; tries++){
      if (cursor >= order.length){
        order = POOL.map((_, i) => i).sort(() => Math.random() - .5);
        cursor = 0;
      }
      const i = order[cursor++];
      if (!showing.has(i)) return i;
    }
    return -1;
  }

  function clearOld(slot, keep){
    Array.from(slot.querySelectorAll("img")).forEach(x => {
      if (x !== keep){ showing.delete(+x.dataset.i); x.remove(); }
    });
  }

  function show(slot, first){
    const i = nextIndex();
    if (i < 0) return;
    showing.add(i);
    const img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.draggable = false;
    img.dataset.i = i;
    img.onload = () => {
      if (first){
        img.className = "fx-fade";
        slot.appendChild(img);
        return;
      }
      const fx = FX[Math.floor(Math.random() * FX.length)];
      img.className = "fx-" + fx;
      slot.appendChild(img);
      setTimeout(() => clearOld(slot, img), 1700);
    };
    img.onerror = () => { showing.delete(i); img.remove(); };
    img.src = POOL[i];
  }

  function visible(slot){ return slot.offsetParent !== null; }

  function sync(){
    slots.forEach(slot => {
      if (!visible(slot)){ clearOld(slot, null); return; }
      if (!slot.querySelector("img")) show(slot, true);
    });
  }

  slots.forEach((slot, k) => {
    const loop = () => {
      setTimeout(() => {
        if (visible(slot) && !document.hidden && !slot.closest(".ph").matches(":hover")){
          show(slot, !slot.querySelector("img"));
        }
        loop();
      }, 7000 + Math.random() * 8000);
    };
    setTimeout(loop, 1500 + k * 700);
  });

  let rs;
  addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(sync, 250); });
  sync();
})();

(function(){
  const TRACKS = [{"title": "небесная твердь", "artist": "#меланхолик", "src": "assets/music/01.mp3", "cover": "assets/music/covers/01.jpg"}, {"title": "странный дом", "artist": "#меланхолик", "src": "assets/music/02.mp3", "cover": "assets/music/covers/02.jpg"}, {"title": "drollXD", "artist": "DJ UNIVXRSEL", "src": "assets/music/03.mp3", "cover": "assets/music/covers/03.jpg"}, {"title": "ex-freundin - slowed + instrumental", "artist": "Luu", "src": "assets/music/04.mp3", "cover": "assets/music/covers/04.jpg"}, {"title": "phonkday", "artist": "cxldwind", "src": "assets/music/05.mp3", "cover": "assets/music/covers/05.jpg"}, {"title": "type london", "artist": "onda andar", "src": "assets/music/06.mp3", "cover": "assets/music/covers/06.jpg"}, {"title": "наше прошлое лето", "artist": "vecher", "src": "assets/music/07.mp3", "cover": "assets/music/covers/07.jpg"}, {"title": "Девочка с каре (Piano)", "artist": "МУККА", "src": "assets/music/08.mp3", "cover": "assets/music/covers/08.jpg"}];
  const audio = new Audio();
  audio.preload = "auto";
  const $ = id => document.getElementById(id);
  const title = $("title"), artist = $("artist"), cover = $("cover"), coverImg = $("coverImg");
  const playBtn = $("play"), playIcon = $("playIcon"), fill = $("fill"), time = $("time"), bar = $("bar");
  const vol = $("vol"), vnum = $("vnum"), mute = $("mute"), muteIcon = $("muteIcon");
  const PLAY = "M8 5v14l11-7z";
  const PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";
  const SPK = "M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z";
  const OFF = "M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z";

  const HINT = "нажми в любом месте, чтобы включить звук";
  let queue = [], history = [], cur = -1, userPaused = false, failed = 0, dead = false, waiting = false;

  function shuffle(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function refill(last){
    queue = shuffle(TRACKS.map((_, i) => i));
    if (queue.length > 1 && queue[queue.length - 1] === last){
      [queue[0], queue[queue.length - 1]] = [queue[queue.length - 1], queue[0]];
    }
  }

  function fmt(s){
    if (!isFinite(s)) return "0:00";
    return Math.floor(s / 60) + ":" + Math.floor(s % 60).toString().padStart(2, "0");
  }

  function load(i){
    cur = i;
    const t = TRACKS[i];
    audio.src = t.src;
    title.textContent = t.title;
    artist.textContent = waiting ? HINT : t.artist;
    coverImg.style.display = "";
    coverImg.src = t.cover || "";
    fill.style.width = "0%";
    time.textContent = "0:00";
    if ("mediaSession" in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title,
        artist: t.artist,
        artwork: t.cover ? [{ src: t.cover, sizes: "240x240", type: "image/jpeg" }] : []
      });
    }
  }

  const nativeVolume = (() => { const a = new Audio(); a.volume = .5; return a.volume === .5; })();
  let actx = null, gain = null;

  function ensureGain(){
    if (nativeVolume || gain || !/^https?:$/.test(location.protocol)) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      actx = new AC();
      gain = actx.createGain();
      actx.createMediaElementSource(audio).connect(gain);
      gain.connect(actx.destination);
      gain.gain.value = audio.muted ? 0 : parseFloat(vol.value) / 100;
    } catch (e) { gain = null; }
  }

  function play(){
    if (dead) return;
    ensureGain();
    if (actx && actx.state === "suspended") actx.resume().catch(() => {});
    const p = audio.play();
    if (p && p.catch) p.catch(e => {
      if (e && e.name === "NotAllowedError" && !userPaused){
        waiting = true;
        artist.textContent = HINT;
      }
    });
  }

  function next(auto){
    if (cur >= 0) history.push(cur);
    if (!queue.length) refill(cur);
    load(queue.pop());
    if (auto || !audio.paused || !userPaused) play();
  }

  function prev(){
    if (audio.currentTime > 3 || !history.length){ audio.currentTime = 0; return; }
    queue.push(cur);
    load(history.pop());
    if (!userPaused) play();
  }

  function setIcon(playing){
    playIcon.setAttribute("d", playing ? PAUSE : PLAY);
    cover.classList.toggle("playing", playing);
  }

  function setVol(v, save){
    v = Math.max(0, Math.min(100, v));
    audio.volume = v / 100;
    if (gain) gain.gain.value = audio.muted ? 0 : v / 100;
    vol.value = v;
    vol.style.setProperty("--p", v + "%");
    vnum.textContent = Math.round(v);
    muteIcon.setAttribute("d", (audio.muted || v === 0) ? OFF : SPK);
    if (save){ try { localStorage.setItem("xb_vol3", String(v)); } catch (e) {} }
  }

  let saved = 10;
  try {
    const v = parseFloat(localStorage.getItem("xb_vol3"));
    if (isFinite(v)) saved = v;
  } catch (e) {}
  setVol(saved, false);

  playBtn.onclick = () => {
    if (audio.paused){ userPaused = false; play(); }
    else { userPaused = true; audio.pause(); }
  };
  $("prev").onclick = prev;
  $("next").onclick = () => next(false);
  mute.onclick = () => { audio.muted = !audio.muted; setVol(parseFloat(vol.value), false); };
  vol.addEventListener("input", () => { audio.muted = false; setVol(parseFloat(vol.value), true); });

  audio.onplay = () => {
    setIcon(true);
    if (waiting){ waiting = false; if (cur >= 0) artist.textContent = TRACKS[cur].artist; }
  };
  audio.onpause = () => setIcon(false);
  audio.onended = () => next(true);
  audio.onerror = () => {
    if (dead) return;
    const src = audio.currentSrc || audio.src || "";
    if (src.startsWith("data:") && !audio.dataset.blob){
      audio.dataset.blob = "1";
      fetch(src).then(r => r.blob()).then(b => {
        audio.src = URL.createObjectURL(b);
        if (!userPaused) play();
      }).catch(giveUp);
      return;
    }
    audio.dataset.blob = "";
    failed++;
    if (failed >= TRACKS.length){ giveUp(); return; }
    setTimeout(() => { if (!dead) next(true); }, 600);
  };
  function giveUp(){
    dead = true;
    audio.pause();
    title.textContent = "музыка не загрузилась";
    artist.textContent = "нужна папка assets рядом с index.html";
    setIcon(false);
  }
  audio.ontimeupdate = () => {
    if (audio.currentTime > .3) failed = 0;
    fill.style.width = (audio.currentTime / audio.duration * 100 || 0) + "%";
    time.textContent = fmt(audio.currentTime);
  };
  bar.onclick = e => {
    const r = bar.getBoundingClientRect();
    if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
  };

  if ("mediaSession" in navigator){
    navigator.mediaSession.setActionHandler("play", () => { userPaused = false; play(); });
    navigator.mediaSession.setActionHandler("pause", () => { userPaused = true; audio.pause(); });
    navigator.mediaSession.setActionHandler("previoustrack", prev);
    navigator.mediaSession.setActionHandler("nexttrack", () => next(false));
  }

  next(false);
  setTimeout(() => { if (audio.paused && !userPaused) play(); }, 1000);
  addEventListener("focus", () => { if (audio.paused && !userPaused && !waiting) play(); });
  const kick = e => {
    if (e.target && e.target.closest && e.target.closest(".win-box")) return;
    if (!userPaused && audio.paused) play();
    if (!audio.paused) off();
  };
  const evs = ["pointerdown", "touchend", "keydown", "click"];
  function off(){ evs.forEach(n => removeEventListener(n, kick, true)); }
  evs.forEach(n => addEventListener(n, kick, true));
  audio.addEventListener("playing", off);
})();

(function(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const narrow = matchMedia("(max-width:900px)");
  const items = Array.from(document.querySelectorAll(".fl"));
  const reset = () => items.forEach(el => el.style.transform = "");
  if (narrow.addEventListener) narrow.addEventListener("change", reset);
  addEventListener("pointermove", e => {
    if (narrow.matches || e.pointerType === "touch") return;
    const nx = e.clientX / innerWidth - .5;
    const ny = e.clientY / innerHeight - .5;
    for (const el of items){
      const d = parseFloat(el.dataset.d || "1") * 26;
      el.style.transform = "translate3d(" + (-nx * d).toFixed(1) + "px," + (-ny * d).toFixed(1) + "px,0)";
    }
  });
})();
